<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WebAjans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500&family=Zilla+Slab:wght@600&display=swap&subset=latin,latin-ext" rel="stylesheet">
<style>
  :root {
    --komur: #241E1A;
    --hamur: #F4ECDD;
    --isot: #8E2C1A;
    --bakir: #B0763C;
    --murekkep: #3A322B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: var(--komur);
    color: var(--hamur);
    font-family: Karla, system-ui, sans-serif;
    line-height: 1.7;
  }
  main { max-width: 34rem; }
  h1 {
    font-family: "Zilla Slab", Georgia, serif;
    font-weight: 600;
    font-size: 2.25rem;
    margin: 0 0 1rem;
    letter-spacing: -0.01em;
  }
  .cizgi {
    width: 3rem;
    height: 1px;
    background: var(--bakir);
    border: 0;
    margin: 0 0 1.5rem;
  }
  p { margin: 0 0 1rem; color: #CDC2B2; }
  a { color: var(--bakir); }
  a:focus-visible { outline: 2px solid var(--bakir); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>WebAjans</h1>
  <hr class="cizgi">
  <p>Yerel işletmeler için hızlı, sade ve mobil uyumlu tanıtım siteleri hazırlıyoruz.</p>
  <p>Size özel hazırlanan demo sayfasının adresi elinizdeki mesajda yer alıyor. Adresi doğrudan tarayıcınıza yapıştırarak açabilirsiniz.</p>
</main>
</body>
</html>
